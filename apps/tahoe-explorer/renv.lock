        "viridis",
        "wesanderson"
      ],
      "VignetteBuilder": "knitr",
      "License": "BSD_3_clause + file LICENSE",
      "URL": "https://colorspace.R-Forge.R-project.org/, https://hclwizard.org/",
      "BugReports": "https://colorspace.R-Forge.R-project.org/contact.html",
      "LazyData": "yes",
      "Encoding": "UTF-8",
