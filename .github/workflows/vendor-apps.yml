name: Vendor apps

# This workflow copies each application in apps/sources.yml from the latest
# release of its repository. It then pushes the result to a branch. A person
# opens the pull request, as the text below explains.
#
# After you publish a release in an application repository, start this workflow:
#
#   gh workflow run vendor-apps.yml -R posit-dev/shiny-showcase-bioinformatics
#
# One run covers every application. The script examines each entry in
# sources.yml, and copies only the applications with a new release. If you
# publish three releases in one month, one run is sufficient.
#
# This workflow has no schedule, and that is deliberate. GitHub disables a
# scheduled workflow after 60 days with no activity in the repository. This
# gallery changes only a few times each year, so a schedule would stop. GitHub
# never disables a workflow that starts only from workflow_dispatch.
on:
  workflow_dispatch: {}

# This workflow has no pull-requests permission. The posit-dev organization
# does not permit GitHub Actions to open pull requests. Therefore the workflow
# pushes a branch, and a person opens the pull request. A personal access token
# or a GitHub App token can remove this limit, but the organization must approve
# it first. The manual step needs no approval, and it cannot expire.
permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests "ruamel.yaml>=0.18"

      - name: Vendor apps from their latest release
        id: vendor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'log<<VENDOR_LOG_EOF'
            python .github/scripts/vendor_apps.py
            echo VENDOR_LOG_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Push the branch if anything changed
        id: push
        run: |
          if ! git status --porcelain -- apps/ | grep -q .; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to do: every app already matches its latest release."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add apps/
          git commit -m "Vendor app updates"
          git push --force origin "$BRANCH"
        env:
          BRANCH: vendor-apps-bot

      - name: Summary
        run: |
          {
            echo '```'
            echo "${{ steps.vendor.outputs.log }}"
            echo '```'
            if [ "${{ steps.push.outputs.changed }}" = "true" ]; then
              echo ""
              echo "Pushed \`vendor-apps-bot\`. Open the PR with:"
              echo ""
              echo '```bash'
              echo "gh pr create -R ${{ github.repository }} --head vendor-apps-bot --fill"
              echo '```'
            else
              echo ""
              echo "No changes; nothing pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
