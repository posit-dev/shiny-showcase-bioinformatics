color:
  palette:
    plum: "#8E5572"
    # Darker plum for links and the `.tech` line -- 8.3:1 on white, so it stays
    # legible at the small sizes both are set in.
    plum-dark: "#6C4157"
    plum-light: "#F0E6EB"
    # Bootstrap-standard alias, picked up automatically by brand.yml consumers.
    pink: plum
  primary: plum
typography:
  fonts:
    - family: "Open Sans"
      source: google
      weight: [300, 400, 600]
    - family: "Source Code Pro"
      source: google
  base:
    family: "Open Sans"
    weight: 400
  monospace: "Source Code Pro"
  headings:
    weight: 300
    line-height: 120%
  link:
    color: plum-dark
    decoration: underline
