# Brand configuration: the app's colors, fonts, and logo in one place.
# Consumed automatically by bslib via `bs_theme(brand = TRUE)` (see ui.R).
# Edit these values to match your brand. Spec: https://posit-dev.github.io/brand-yml/

meta:
  name: Variant Reviewer

color:
  # Organic palette: muted, earthy tones for a simple, clean look. `green`
  # drives buttons/links/accents; `clay` is a warm accent for a second series;
  # neutrals are warm (paper background, warm-charcoal text) rather than pure
  # black/white. Keep in sync with `vr_colors` in R/ui_helpers.R (used for plots).
  palette:
    green: "#4c7a5b"
    clay: "#c07a52"
    stone: "#7a7468"
    charcoal: "#2c2a25"
    paper: "#faf8f3"
  primary: green
  secondary: stone
  foreground: charcoal
  background: paper

typography:
  fonts:
    - family: Inter
      source: google
      weight: [400, 500, 600, 700]
  base:
    family: Inter
    size: 16px
  headings:
    family: Inter
    weight: 600
