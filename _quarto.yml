project:
  type: website
  # apps/ holds vendored source for real deployment (see apps/sources.yml), not
  # site content. Some apps carry their own .qmd files (report templates,
  # docs); without this, Quarto's project-wide scan would try to render those
  # as pages on this site.
  render:
    - "*.qmd"
    - "!apps/**"

website:
  title: "Shiny in Bioinformatics"
  # No navbar: the site is a single page, with apps and supporting packages as
  # sections of it.
  page-footer:
    center: |
      Compiled by
        [![](Posit-Logos-2024_horiz-full-color.svg){fig-alt="Posit" width=65px}](https://posit.co)
      |
      Built with [Quarto](http://quarto.org)

format:
  html:
    toc: false
    theme: [cosmo, brand, styles.scss]
