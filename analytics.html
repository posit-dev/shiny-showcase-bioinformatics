<!-- GoatCounter, the visit counter of the gallery. It sets no cookie. The path
     it records begins with the hostname, so the gallery page and every
     application land in one dashboard. count.js sends nothing from localhost. -->
<script>
  window.goatcounter = { path: function(p) { return location.host + p } };
</script>
<script data-goatcounter="https://samuelbharti.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
