# The applications that the vendor workflow copies into apps/. Connect Cloud
# deploys each one from apps/<name> on the main branch.
#
# .github/workflows/vendor-apps.yml controls this file. After you publish a
# release in an application repository, start the workflow by hand:
#
#   gh workflow run vendor-apps.yml -R posit-dev/shiny-showcase-bioinformatics
#
# The workflow examines every `repo` below. If a repository has a release that
# is newer than its `ref`, the workflow does three operations. It copies the
# files into apps/<name>/. It writes the new tag into `ref`. Then it pushes the
# `vendor-apps-bot` branch.
#
# A person then opens the pull request with `gh pr create`. This step is manual,
# because the posit-dev organization does not permit GitHub Actions to open
# pull requests.
#
# Nothing else must edit this file. The workflow keeps these comments when it
# writes the file, because it uses the round-trip mode of ruamel.yaml.
#
# `include` is a list of the paths to copy, relative to the root of the source
# repository. It is not "every file in the release archive". An application
# repository also holds development tools, internal notes, evaluations and
# tests, and a deployed application must not contain them. A list of permitted
# paths also stops an unexamined repository from sending one of those files
# here. `manifest.json` must always be in the list. The source repository makes
# that file, this repository does not, and Connect Cloud deploys from it.
#
# The list must also contain every file that the manifest names. Examples are
# renv.lock and DESCRIPTION. Connect Cloud reads the manifest, and then it reads
# those files. Read the manifest of the application before you write the list.
# .github/scripts/check_sources.py makes this test on every pull request.
#
# `allow_missing_manifest_files` is optional, and its default is false. This
# value makes the test above a warning for one entry. Use it only when the
# source repository writes a manifest of the complete repository, and not of the
# application alone. Correct the source repository, then remove this value.
#
# You can add an application before its first release. The workflow reports it
# as WAIT and continues. The application starts to synchronize by itself after
# a release appears. The workflow never guesses the latest version from a list
# of tags.
#
# Each application is independent. If one entry fails, the workflow reports the
# error, copies every other application, and then stops with a failure.
#
# To add later, when it is ready:
#   gene-list-builder  The repository is private, and it publishes no release.
#
# Four applications are absent from this list, and they must stay absent:
#
#   de-explorer  signature-scoring  drug-perturbation  genome-explorer
#
# This repository is the home of those four. A person changes them here, and
# no other repository sends a change. The workflow must never write to them,
# because a copy from a release would remove the work.
#
# They came from posit-dev/lifescience-shiny-gallery one time, and a person
# copied them by hand. That repository publishes no release. Its R/_shared and
# R/_modules directories are also build output, and git ignores them there, so
# a release archive would give applications that fail at startup.
apps:
  - name: genescout
    repo: samuelbharti/genescout
    ref: "v0.1.0"
    include:
      - app.R
      - global.R
      - ui.R
      - server.R
      - manifest.json
      - config.yml
      - _brand.yml
      - R
      - modules
      - api
      - userInterface
      - report
      - www
      - prompts
      - context
      - data
      - rubric.yml
      - renv.lock
      - DESCRIPTION
      - .Rprofile
    # Waiver. manifest.json of genescout describes the complete repository, and
    # not the application. It names 141 files that are tests, notes and
    # workflows, and a deployment must not contain them. genescout must put
    # those paths in .rscignore, write the manifest again, and publish a new
    # release. Remove this line then. Connect Cloud cannot deploy genescout
    # until that happens.
    allow_missing_manifest_files: true

  - name: tahoe-explorer
    repo: samuelbharti/tahoe-explorer
    ref: "v0.1.1"
    include:
      - global.R
      - ui.R
      - server.R
      - manifest.json
      - renv.lock
      - _brand.yml
      - R
      - modules
      - userInterface
      - inst
      - data
      - www

  # The manifest of this application names its LICENSE, README.md and CITATION
  # files. Therefore the list below contains them, although a deployment does
  # not need them.
  - name: variant-reviewer
    repo: samuelbharti/variant-reviewer
    ref: "v2.3.0"
    include:
      - app.R
      - app_ui.R
      - app_server.R
      - global.R
      - manifest.json
      - renv.lock
      - _brand.yml
      - .Rprofile
      - .Rbuildignore
      - .gitattributes
      - demo_cache.rds
      - R
      - modules
      - userInterface
      - data
      - www
      - LICENSE
      - README.md
      - CITATION.cff
      - CITATION.md
