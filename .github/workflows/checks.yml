name: Checks

# These tests operate on every pull request, and also on main after a merge.
# They have no path filter. A filter makes a test invisible when the pull
# request does not touch the paths, and a required test that never operates
# gives a false result.
#
# Each job is independent, so one failure still shows the result of the others.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  manifests:
    name: Manifests match the applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "ruamel.yaml>=0.18"

      - run: python .github/scripts/check_manifests.py

  apps_yml:
    name: apps.yml describes the deployments correctly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "ruamel.yaml>=0.18"

      # The tests of the program come first. Its exit status is the only
      # assertion that the step below makes, so a test that stopped working
      # would turn this job green for every apps.yml.
      - run: python .github/scripts/test_deploy_matrix.py

      # apps.yml is the source of truth for which applications deploy and where.
      # This is the same program that deploy-apps.yml operates to build its
      # matrix, so a mistake in those fields fails here, on the pull request,
      # and not on main with a deployment half done. It exits non-zero for a
      # tile whose `app`, `content_id` or `deploy` has the wrong shape; the
      # docstring of the script lists what it tests.
      - run: python .github/scripts/deploy_matrix.py

  sources:
    name: sources.yml matches the releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests "ruamel.yaml>=0.18"

      # This job reads the source repositories through the GitHub API. The
      # token of the workflow can read a public repository.
      - run: python .github/scripts/check_sources.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secrets:
    name: No secrets
    runs-on: ubuntu-latest
    steps:
      # gitleaks reads the history, so this job needs every commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the name of each file
        run: python .github/scripts/check_secrets.py

      # The gitleaks Action needs a license for an organization. The program
      # itself is free, so this step reads the release directly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `--redact` keeps the value out of the log. The log of a public
      # repository is readable by everybody.
      - name: Read the content of each file
        run: gitleaks dir . --no-banner --redact --verbose

      - name: Read the history of git
        run: gitleaks git . --no-banner --redact --verbose
