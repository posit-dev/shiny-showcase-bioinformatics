# Supporting packages -- same shape as apps.yml, same required fields. Rendered
# as a section on index.qmd, after the apps.
#
# Tooling that isn't a package (shinyreact, RShiny_template, Plotomics Live) is
# deliberately not listed here -- add a category for it if that changes.
#
# `intro` is optional and renders as a lead-in paragraph under the heading.
#
# Package tiles use `fit: hex`, which centres the package's hex logo on a tint
# rather than cropping it like a screenshot. The logos are copied from each
# package's own man/figures/logo.svg (or .png).
- category: Supporting Packages
  intro: >-
    The packages I've built and maintain underneath the applications. Each one
    does a single job, and the applications compose them.
  tiles:
    - title: biobouncer
      org: R · Python
      description: >-
        A gate for biological inputs. Validate gene symbols, ontology terms, variant
        formats and accessions through one small API, offline against bundled
        snapshots or live against the source. R and Python are tested against a
        shared conformance corpus, so the two cannot quietly disagree.
      thumbnail: biobouncer.png
      fit: hex
      alt: biobouncer hex logo
      tech: "48 sources · 4 modes: pattern · cache · remote · existence"
      links:
        - text: GitHub
          url: https://github.com/samuelbharti/biobouncer
        - text: R-universe
          url: https://samuelbharti.r-universe.dev/biobouncer
        - text: PyPI
          url: https://pypi.org/project/biobouncer/
        - text: DOI
          url: https://doi.org/10.5281/zenodo.21346522
      tags: validation, gene symbols, ontology, cross-language

    - title: biohttp
      org: R
      description: >-
        Normalized HTTP transport for web service calls. A call returns a result value
        instead of raising a condition, so you branch on data rather than on an error
        handler, and transport failure, a bad status code and an unreadable body stay
        three distinct outcomes. Circuit breaking, retry, throttling and a
        success-only cache are the defaults.
      thumbnail: biohttp.svg
      fit: hex
      alt: biohttp hex logo
      tech: "circuit breaker · retry · throttle · success-only cache · batch"
      links:
        - text: GitHub
          url: https://github.com/samuelbharti/biohttp
        - text: R-universe
          url: https://samuelbharti.r-universe.dev/biohttp
        - text: Docs
          url: https://www.samuelbharti.com/biohttp/
      tags: http, transport, circuit breaker, caching

    - title: bioclients
      org: R
      description: >-
        One client per biological database, each split into a request half and a pure
        parser half, so the parser is tested against a stored response with no
        network. Transport, retries and caching are left to biohttp. Per-service
        dependencies are optional.
      thumbnail: bioclients.svg
      fit: hex
      alt: bioclients hex logo
      tech: "29 services · Ensembl · UniProt · gnomAD · Open Targets · AlphaFold"
      links:
        - text: GitHub
          url: https://github.com/samuelbharti/bioclients
        - text: R-universe
          url: https://samuelbharti.r-universe.dev/bioclients
        - text: Docs
          url: https://www.samuelbharti.com/bioclients/
      tags: rest api, ensembl, uniprot, gnomad, open targets

    # No hex logo exists for plotomics, so this tile keeps a representative
    # figure. Swap in a hex and set `fit: hex` when there is one.
    - title: plotomics
      org: TypeScript · R · Python
      description: >-
        Seventeen GPU-accelerated bioinformatics visualizations from one TypeScript
        core, wrapped three ways: npm for React, htmlwidgets for R, anywidget for
        Python. Large data never goes through JSON. The components are headless
        imperative factories rather than React components, which is why the same core
        drops into Shiny, React and Jupyter unchanged.
      thumbnail: plotomics.png
      tech: 17 components · volcano · embedding · heatmap · igv · network · oncoplot · spatial · and ten more
      tags: visualization, gpu, webgl, htmlwidgets, anywidget
