# The supporting packages. This file has the same fields as apps.yml. Quarto
# shows it as a section of index.qmd, below the applications.
#
# Tools that are not packages are absent from this file. Examples are
# shinyreact, RShiny_template, and Plotomics Live. If that changes, add a
# category for them.
#
# `intro` is optional. Quarto shows it as a paragraph below the heading.
#
# Each package tile uses `fit: hex`. This value puts the hex logo of the package
# in the center of a tint. It does not crop the image, as it crops a screenshot.
# Each logo is a copy of man/figures/logo.svg (or .png) from that package.
- category: Supporting Packages
  intro: >-
    The packages I've built and maintain underneath the applications. Each one
    does a single job, and the applications compose them.
  tiles:
    - title: biobouncer
      org: R · Python · TypeScript
      description: >-
        Validates gene symbols, ontology terms, variant formats and other biological
        database IDs, offline or live, through one API. R, Python and TypeScript share
        one conformance corpus, so they always agree.
      thumbnail: biobouncer.png
      fit: hex
      alt: biobouncer hex logo
      tech: "48 sources · 4 modes: pattern · cache · remote · existence"
      links:
        - text: GitHub
          url: https://github.com/samuelbharti/biobouncer
        - text: Docs
          url: https://www.samuelbharti.com/biobouncer/
        - text: CRAN
          url: https://cran.r-project.org/package=biobouncer
        - text: PyPI
          url: https://pypi.org/project/biobouncer/
        - text: npm
          url: https://www.npmjs.com/package/biobouncer
        - text: R-universe
          url: https://samuelbharti.r-universe.dev/biobouncer
        - text: DOI
          url: https://doi.org/10.5281/zenodo.21346522
      tags: validation, gene symbols, ontology, cross-language

    - title: biohttp
      org: R
      description: >-
        HTTP transport for R clients of biological web services. Calls return a result
        value instead of raising, so failures stay distinct from bad data. Circuit
        breaking, retry and caching are defaults.
      thumbnail: biohttp.svg
      fit: hex
      alt: biohttp hex logo
      tech: "circuit breaker · retry · throttle · success-only cache · batch"
      links:
        - text: GitHub
          url: https://github.com/samuelbharti/biohttp
        - text: Docs
          url: https://www.samuelbharti.com/biohttp/
        - text: CRAN
          url: https://cran.r-project.org/package=biohttp
        - text: R-universe
          url: https://samuelbharti.r-universe.dev/biohttp
        - text: DOI
          url: https://doi.org/10.5281/zenodo.21731864
      tags: http, transport, circuit breaker, caching

    - title: bioclients
      org: R
      description: >-
        One client per biological database, each split into a request half and a pure
        parser half that needs no network to test. Transport and caching are left to
        biohttp.
      thumbnail: bioclients.svg
      fit: hex
      alt: bioclients hex logo
      tech: "29 services · Ensembl · UniProt · gnomAD · Open Targets · AlphaFold"
      links:
        - text: GitHub
          url: https://github.com/samuelbharti/bioclients
        - text: Docs
          url: https://www.samuelbharti.com/bioclients/
        - text: R-universe
          url: https://samuelbharti.r-universe.dev/bioclients
        - text: DOI
          url: https://doi.org/10.5281/zenodo.21770870
      tags: rest api, ensembl, uniprot, gnomad, open targets

    - title: plotomics
      org: TypeScript · R · Python
      description: >-
        GPU-accelerated bioinformatics visualization for R, Python and the web, from one
        TypeScript core. Seventeen components, wrapped as npm for React, htmlwidgets for
        R, and anywidget for Python.
      thumbnail: plotomics.svg
      fit: hex
      alt: plotomics hex logo
      tech: 17 components · volcano · embedding · heatmap · igv · network · oncoplot · spatial · and ten more
      links:
        - text: GitHub
          url: https://github.com/samuelbharti/plotomics
        - text: Docs
          url: https://www.samuelbharti.com/plotomics/
        - text: npm
          url: https://www.npmjs.com/package/plotomics
        - text: CRAN
          url: https://cran.r-project.org/package=plotomics
        - text: PyPI
          url: https://pypi.org/project/plotomics/
        - text: R-universe
          url: https://samuelbharti.r-universe.dev/plotomics
        - text: DOI
          url: https://doi.org/10.5281/zenodo.21926306
      tags: visualization, gpu, webgl, htmlwidgets, anywidget

    - title: biocohort
      org: R
      description: >-
        Keeps the subjects, samples and analysis outputs of an omics study in one
        validated object. Species and assay are values in the data, not columns or
        classes, so one manifest works for any organism and any omics assay.
      thumbnail: biocohort.png
      fit: hex
      alt: biocohort hex logo
      tech: "sample manifest · pipeline sample sheets · analysis registry · cross-species translation"
      links:
        - text: GitHub
          url: https://github.com/samuelbharti/biocohort
        - text: Docs
          url: https://www.samuelbharti.com/biocohort/
      tags: cohort, sample manifest, cross-species, omics
