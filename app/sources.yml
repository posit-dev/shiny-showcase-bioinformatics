# The applications that the vendor workflow copies into app/. Connect Cloud
# deploys each one from app/<name> on the main branch.
#
# .github/workflows/vendor-apps.yml controls this file. After you publish a
# release in an application repository, start the workflow by hand:
#
#   gh workflow run vendor-apps.yml -R posit-dev/shiny-showcase-bioinformatics
#
# The workflow examines every `repo` below. If a repository has a release that
# is newer than its `ref`, the workflow does three operations. It copies the
# files into app/<name>/. It writes the new tag into `ref`. Then it pushes the
# `vendor-apps-bot` branch.
#
# A person then opens the pull request with `gh pr create`. This step is manual,
# because the posit-dev organization does not permit GitHub Actions to open
# pull requests.
#
# Nothing else must edit this file. The workflow keeps these comments when it
# writes the file, because it uses the round-trip mode of ruamel.yaml.
#
# `include` is a list of the paths to copy, relative to the root of the source
# repository. It is not "every file in the release archive". An application
# repository also holds development tools, internal notes, evaluations and
# tests, and a deployed application must not contain them. A list of permitted
# paths also stops an unexamined repository from sending one of those files
# here. `manifest.json` must always be in the list. The source repository makes
# that file, this repository does not, and Connect Cloud deploys from it.
#
# The list must also contain every file that the manifest names. Examples are
# renv.lock and DESCRIPTION. Connect Cloud reads the manifest, and then it reads
# those files. Read the manifest of the application before you write the list.
#
# You can add an application before its first release. The workflow reports it
# as WAIT and continues. The application starts to synchronize by itself after
# a release appears. The workflow never guesses the latest version from a list
# of tags.
#
# Each application is independent. If one entry fails, the workflow reports the
# error, copies every other application, and then stops with a failure.
#
# To add later, when each one is ready:
#   variant-reviewer   manifest.json exists, but there is no release.
#   gene-list-builder  It needs both.
#
# The four lifescience applications in app/ are absent from this list, and a
# person copies them by hand. posit-dev/lifescience-shiny-gallery publishes no
# releases. Its R/_shared and R/_modules directories are build output, and git
# ignores them there, so a release archive would give applications that fail at
# startup. Copy those four from a synchronized working tree of that repository.
apps:
  - name: genescout
    repo: samuelbharti/genescout
    ref: ""
    include:
      - app.R
      - global.R
      - ui.R
      - server.R
      - manifest.json
      - config.yml
      - _brand.yml
      - R
      - modules
      - api
      - userInterface
      - report
      - www
      - prompts
      - context
      - data
      - rubric.yml
      - renv.lock
      - DESCRIPTION
      - .Rprofile

  - name: tahoe-explorer
    repo: samuelbharti/tahoe-explorer
    ref: ""
    include:
      - global.R
      - ui.R
      - server.R
      - manifest.json
      - renv.lock
      - _brand.yml
      - R
      - modules
      - userInterface
      - inst
      - data
      - www
