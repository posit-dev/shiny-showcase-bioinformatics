<!-- Static client root served by shinyreact::page_react_html("www/index.html").
     page_react_html injects the shinyreact HTMLDependency (React + hooks)
     where the placeholder meta tag is; this file only needs that placeholder,
     our stylesheet, the mount point, and the built bundle. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="shiny-dependency-placeholder" content="">
<title>Plotomics Live - biological visualizations, two ways</title>
<link rel="stylesheet" href="app.css" />
<!-- GoatCounter, the visit counter of the bioinformatics gallery. It sets no
     cookie. The path it records begins with the hostname, so every application
     of the gallery lands in one dashboard. count.js sends nothing from
     localhost. -->
<script>
  window.goatcounter = { path: function(p) { return location.host + p } };
</script>
<script data-goatcounter="https://samuelbharti.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div id="root"></div>
<script src="app.js" defer></script>
</body>
</html>
